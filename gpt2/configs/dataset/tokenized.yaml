base_dataset_name: "roszcz/maestro-sustain-v2"
extra_datasets: ["roszcz/giant-midi-sustain-v2", "roszcz/pianofor-ai-sustain-v2"]
tokenizer_parameters:
  min_time_unit: ${tokenizer.tokenizer_parameters.min_time_unit}
  n_velocity_bins: ${tokenzier.tokenizer_parameters.n_velocity_bins}
pause_detection_threshold: 4
augmentation:
  speed_change_factors: [0.95, 0.975, 1.025, 1.05]
  max_pitch_shift: 5
